# agent-work-policy — Git作業の1操作を、repositoryが所有するpolicyのpermissionとhuman gateに従って実行する。
# 公開する入力・出力・保証は CONTRACT.md が正式な定義。工程順はこのYAMLの宣言を正式な定義とするで、同じagentが辿る。
version: 2
name: agent-work-policy
description: Git作業の1操作を、permissionとhuman gateに従って実行する
inputs: [contract, version, action, repo, approved, branch, paths, message, title, body_file, pr]
requires: []

# 機械可読な公開契約の宣言。manifest の metadata.harness.implements[].actions と同じ集合を持つ。
contract:
  contract_id: agent-work-policy/agent-work-policy
  contract_version: 1
  invocation:
    input: object
    output: object
    entry: scripts/invoke.py
  actions: [inspect, plan, start, commit, push, pull-request, ready-for-review, merge-readiness, merge, cleanup]
  gate_states: [allowed, waiting_for_human, denied]
  statuses: [completed, waiting_for_human, failed]

steps:
  - id: build-input
    agent_work: invoking_agent
    purpose: 契約入力をそのまま使うか、自然言語の依頼から1 actionの入力objectを組み立てる
    needs: [contract, version, action, repo, approved, branch, paths, message, title, body_file, pr]
    provides: [request]

  - id: config
    script: scripts/config.py
    purpose: 対象repositoryのgit rootに固定したpolicy設定fileをschema検査し、絶対pathと値を返す。不備なら操作へ進まない
    needs: [repo]
    provides: [config_path, config_values]

  - id: invoke
    script: scripts/invoke.py
    purpose: 検査済みのpolicy設定に従い、permission・readiness・gateを適用して許可された1操作だけを実行し、公開結果objectを返す
    needs: [request, config_path]
    provides: [status, gate_state, operation_result, approval_target, workspace, reason]

  - id: report
    agent_work: invoking_agent
    purpose: 公開結果objectを呼び出し元へ直接返し、承認待ちなら承認対象を提示する
    needs: [status, gate_state, operation_result, approval_target, workspace, reason]
