# agent-work-policy のpolicy設定の記入例。<repo>/.harness-plugins/agent-work-policy.config.yml へ
# 全keyを書いて置く（同梱既定へのfallbackは無い。この例が既定値として読まれることもない）。
# workspace: 作業場所とbranch規則。空のworktree_rootはOSの一時directoryを使う。
# permissions: 操作を許すか。falseは人間の承認でも上書きできない。
# gates: trueなら操作直前に依頼者の明示承認が要る。
# verification: commit前に全て成功させるcommand。
# merge.readiness: merge gateを提示してよい状態の機械条件。required_checksはmergeに必要なcheckの唯一の定義で、
#   check名と報告元GitHub Appのslugの組を並べる（同名checkを別のAppやworkflowが成功させても通さないため）。
version: 1
workspace:
  use_worktree: false
  require_clean_start: true
  base_branch: main
  branch_prefix: agent/
  worktree_root: ""
git:
  remote: origin
permissions:
  commit: true
  push: true
  pull_request: true
  merge: false
gates:
  before_commit: true
  before_push: true
  before_pull_request: true
  before_merge: true
verification:
  commands: ["git diff --check"]
pull_request:
  draft: true
merge:
  method: squash
  delete_branch: false
  delete_worktree: false
  readiness:
    min_approvals: 1
    required_checks:
      - {name: validate, app: github-actions}
    require_no_unresolved_threads: true
