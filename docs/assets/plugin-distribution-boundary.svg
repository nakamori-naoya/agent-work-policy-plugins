<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Repository公開物とpluginインストール物の境界</title>
  <desc id="desc">Repository内のmarketplace catalogがleaf plugin rootを選択し、そのrootだけがinstall cacheへ渡る。Repository開発資産はinstall対象外。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245f9e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #172033; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #5c6c82; }
    </style>
  </defs>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="40" y="42" class="title">配布境界は「repository公開」と「plugin install」で異なる</text>

  <rect x="40" y="75" width="650" height="390" rx="16" fill="#f7f9fc" stroke="#7d91aa" stroke-width="2"/>
  <text x="65" y="110" class="label">Git repository 公開物</text>

  <rect x="75" y="135" width="260" height="105" rx="10" fill="#edf2f8" stroke="#7d91aa"/>
  <text x="95" y="168" class="label">Marketplace catalog</text>
  <text x="95" y="197" class="body">.agents/plugins/marketplace.json</text>
  <text x="95" y="221" class="body">.claude-plugin/marketplace.json</text>

  <rect x="390" y="135" width="260" height="210" rx="10" fill="#dcecff" stroke="#245f9e" stroke-width="3"/>
  <text x="415" y="168" class="label">Leaf plugin root</text>
  <text x="415" y="199" class="body">両runtime manifest</text>
  <text x="415" y="225" class="body">skills / SKILL.md</text>
  <text x="415" y="251" class="body">playbook.yml / config</text>
  <text x="415" y="277" class="body">scripts / references</text>
  <text x="415" y="303" class="body">assets / README.md</text>
  <text x="415" y="329" class="small">実行時に必要な範囲で自己完結</text>

  <rect x="75" y="275" width="260" height="150" rx="10" fill="#fff5e6" stroke="#b5791f"/>
  <text x="95" y="308" class="label">Repository開発資産</text>
  <text x="95" y="339" class="body">AGENTS.md / root README</text>
  <text x="95" y="365" class="body">shared / root scripts</text>
  <text x="95" y="391" class="body">tests / docs / policy</text>
  <text x="95" y="415" class="small">Gitでは公開、個別payloadには非同梱</text>

  <path d="M335 188 L385 188" stroke="#245f9e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="342" y="172" class="small">source</text>

  <rect x="765" y="155" width="290" height="210" rx="16" fill="#eef8f1" stroke="#2f7a47" stroke-width="3"/>
  <text x="795" y="193" class="label">Installed plugin cache</text>
  <text x="795" y="230" class="body">選択したleaf rootの内容</text>
  <text x="795" y="260" class="body">plugin単位のversion境界</text>
  <text x="795" y="290" class="body">兄弟pluginは別install unit</text>
  <text x="795" y="320" class="small">repository rootへ実行時依存しない</text>

  <path d="M650 240 L755 240" stroke="#245f9e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="677" y="222" class="body">install</text>
  <path d="M335 350 C610 450, 710 430, 760 350" stroke="#b5791f" stroke-width="2" stroke-dasharray="8 7" fill="none"/>
  <text x="455" y="440" class="small">開発資産はinstall境界を越えない</text>
</svg>
