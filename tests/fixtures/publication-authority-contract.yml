version: 1
workspace:
  use_worktree: false
  require_clean_start: true
  base_branch: main
  branch_prefix: agent/
  worktree_root: ""
git:
  remote: origin
permissions:
  commit: true
  push: true
  pull_request: true
  merge: false
gates:
  before_commit: true
  before_push: true
  before_pull_request: true
  before_merge: true
verification:
  commands: ["git diff --check"]
pull_request:
  draft: true
merge:
  method: squash
  delete_branch: false
  delete_worktree: false
  readiness:
    min_approvals: 1
    required_checks:
      - {name: gitleaks, app: github-actions}
      - {name: trufflehog, app: github-actions}
    require_no_unresolved_threads: true
